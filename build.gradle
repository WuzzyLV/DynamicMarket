plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    // Pinned to the last 8.x line: shadow 9.x needs a Gradle newer than the 8.14.3 wrapper here,
    // and anything before 8.3.6's ASM bump can't read our Java 25 (class file major version 69)
    // output at all — bumping the Gradle wrapper is a separate decision from adding InvUI.
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'me.wuzzyxy'
version = '2.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven { url = 'https://repo.momirealms.net/releases/' }
    maven { url = 'https://repo.xenondevs.xyz/releases' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.2.build.102-stable"
    compileOnly 'me.clip:placeholderapi:2.12.3'
    // https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Custom blocks/items — items.yml keys containing a ':' resolve through this instead of Material.
    compileOnly 'net.momirealms:craft-engine-core:26.7.1'
    compileOnly 'net.momirealms:craft-engine-bukkit:26.7.1'

    // Vault economy — provided by the Vault plugin at runtime. Exclude its legacy bukkit transitive,
    // paper-api already supplies a newer one and having both on the compile classpath is ambiguous.
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    // The shop GUI. Not a server-installed plugin, so it has to be shaded into our own jar —
    // see the shadowJar block below, which relocates it so it can't clash with another plugin's
    // own shaded copy on the same server.
    implementation 'xyz.xenondevs.invui:invui:2.2.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // paper-api is compileOnly, so the report tests need adventure on their own
    testImplementation 'net.kyori:adventure-text-minimessage:5.2.0'
    testImplementation 'net.kyori:adventure-text-serializer-legacy:5.2.0'
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

kotlin {
    jvmToolchain(targetJavaVersion)
}

processResources {
    // plugin.yml declares the stdlib as a runtime library, and that version has to be the
    // one we compiled against.
    def props = [version: version, kotlinVersion: kotlin.coreLibrariesVersion]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// InvUI isn't a server-installed plugin like PlaceholderAPI/Vault/CraftEngine, so unlike
// mysql-connector-j and kotlin-stdlib (still fetched at runtime, see plugin.yml `libraries:`),
// it has to physically be in our jar. shadowJar replaces the plain `jar` output and bundles
// *only* invui's own classes — its transitive deps (fastutil, adventure) are already on the
// server via Paper, and pulling them in too would risk shipping a stale duplicate copy.
// Relocated so a second plugin shading its own InvUI copy on the same server can't collide with it.
tasks.jar {
    enabled = false
}

tasks.shadowJar {
    archiveClassifier.set('')
    dependencies {
        include(dependency('xyz.xenondevs.invui:invui'))
    }
    relocate 'xyz.xenondevs.invui', 'me.wuzzyxy.dynamicmarket.libs.invui'
}

tasks.build.dependsOn tasks.shadowJar
