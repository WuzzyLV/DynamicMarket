
## MYSQL
mysql:
  host: localhost
  port: 3306
  database: test
  username: root
  password: root
  # The driver waits forever by default. We connect during startup on the main thread, so an
  # unreachable host would hang the whole server instead of just failing the plugin.
  connect_timeout_ms: 5000
  # Ceiling on any single query. Also bounds the push task, which runs on the main thread.
  socket_timeout_ms: 15000

#  Seconds. Only controls how often working state is flushed to MySQL — prices are read
#  live, so this no longer affects what anyone is quoted.
push_interval: 10

history:
  # A price point per item on this cadence whether or not anyone traded. Trades write
  # their own points; this fills the gaps so a quiet item still has a chart and the 24h
  # comparison has something to read.
  snapshot_minutes: 30
  # 0 keeps everything forever.
  retention_days: 90

report:
  # Movers are recomputed on this cadence, and every placeholder serves off that snapshot.
  # DeluxeMenus resolves placeholders per slot per refresh, so they must never hit MySQL.
  refresh_seconds: 60
  window_hours: 24
  # Moves smaller than this count as flat, so noise does not top the board.
  min_change_percent: 0.1
  # MiniMessage. <item> and <change> are filled in; <change> is already signed when negative.
  mover_up: "<green>▲ <white><item> <green>+<change>%"
  mover_down: "<red>▼ <white><item> <red><change>%"
  trend_up: "<green>▲"
  trend_down: "<red>▼"
  trend_flat: "<gray>-"
  # Shown when there is no Nth mover. Leave blank to hide the line via a DeluxeMenus requirement.
  empty: ""
  # <category>, <avg_change>, <up_count>, <down_count>, <tracked_count>.
  category_summary: "<white><category> <gray>avg <avg_change><white>% <green><up_count>↑ <red><down_count>↓"
  # A category (or "all") counts as bullish/bearish once up_percent/down_percent reaches this
  # threshold; otherwise it's mixed. up_percent/down_percent are a share of the MOVERS (items
  # that cleared min_change_percent either way), not of every tracked item — a category that's
  # mostly flat with a couple of fallers and zero risers is bearish, not mixed, even though
  # those fallers are a small slice of the whole category. <up_percent>, <down_percent>,
  # <up_count>, <down_count>, <tracked_count>, <category> are available in all three templates.
  sentiment_threshold_percent: 60
  sentiment_bullish: "<green>Bullish <gray>- <white><up_percent>% of movers rising <gray>(<tracked_count> tracked)"
  sentiment_bearish: "<red>Bearish <gray>- <white><down_percent>% of movers falling <gray>(<tracked_count> tracked)"
  sentiment_mixed: "<yellow>Mixed <gray>- <white><up_count> up <gray>/ <white><down_count> down"
  # Units bought+sold within the report window, ranked per category (or "all"). <item>, <units>,
  # <bought>, <sold>.
  volume_leader: "<white><item> <gray>- <white><units> <gray>traded"
# Fraction of the buy price you get back when selling. This used to be the only thing
# standing between the market and a round-trip profit, and it was not enough. Pricing
# along the curve handles that now, so the spread is free to be something players will
# actually trade against.
sell_multiplier: 0.85

# The /market GUI. Needs Vault + an economy plugin to actually trade; without one the
# menu still opens (browsing prices is harmless) but buy/sell/sell-all are refused.
shop:
  # Quantity tiers offered on an item's buy/sell screen, left to right — as many as menus.yml
  # gives the item screen 'q' slots for. A tier above the item's normal stack size still shows
  # its real count on the icon, but vanilla caps that at 99, so past 99 the number the client
  # draws is its own business and %amount% in the tier's name is what players can rely on.
  quantities: [1, 6, 12, 32, 64]
  sounds: true