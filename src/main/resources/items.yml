# units_to_double: net units of one-way flow needed to double (or halve) the price.
#   Rule of thumb: roughly one active player's weekly output of that item. A single
#   grinder should visibly move the market over a week, the whole server in a day or two.
#   Do NOT use one value everywhere — cobble moves in shulkers, dyes move in stacks,
#   and a shared number means the bulk items pin at the bottom while the rest never budge.
# half_life_hours: how fast net position drifts back to zero. Renewables heal fast,
#   awkward-to-farm things stay crashed longer so the crash is worth something.
# min_price is inert — the exponential curve asymptotes instead of hitting a floor.

items:
  # bulk terrain, farmable by the shulker
  cobblestone:
    base_price: 0.6
    category: masonry
    units_to_double: 40000
    half_life_hours: 36
    min_price: 0.04
