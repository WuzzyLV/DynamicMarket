name: DynamicMarket
version: '${version}'
main: me.wuzzyxy.dynamicmarket.DynamicMarket
api-version: '26.2'

softdepend:
  - PlaceholderAPI
  - Vault
  - CraftEngine

# Fetched from Maven Central on first boot and cached under the server's libraries folder.
# The jar carries only plugin classes, so without this the plugin dies on NoClassDefFoundError.
# InvUI is shaded into the jar directly instead (see build.gradle) — it isn't on Maven Central.
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}

commands:
  dmarket:
    description: Main command for DynamicMarket
    usage: /dmarket <subcommand>
    permission: dynamicmarket.command
    subcommands:
      reload:
        description: Reloads the plugin
        usage: /dmarket reload
        permission: dynamicmarket.command.reload
      help:
        description: Shows the help page
        usage: /dmarket help
      buy:
        description: Buys an item from a market
        usage: /dmarket buy <name> <item> [amount]
        permission: dynamicmarket.command.buy
      sell:
        description: Sells an item to a market
        usage: /dmarket sell <name> <item> [amount]
        permission: dynamicmarket.command.sell
      holo:
        description: Places/removes/moves market holo boards
        usage: /dmarket holo <place|remove|move|list> ...
        permission: dynamicmarket.command.holo
      event:
        description: Lists, force-triggers or shows the last random market event
        usage: /dmarket event <list|trigger [id]|last>
        permission: dynamicmarket.command.event
  market:
    description: Opens the market shop GUI
    usage: /market [category]
    aliases: [marketplace, shop, buy, sell]
    permission: dynamicmarket.menu

permissions:
  dynamicmarket.menu:
    description: Allows opening the market shop GUI
    default: true
  dynamicmarket.command:
    description: Allows use of /dmarket
    default: op
